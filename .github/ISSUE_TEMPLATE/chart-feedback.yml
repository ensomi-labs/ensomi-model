name: Chart feedback
description: Tell us how a chart generated by ensomi plays, as a mapper or a player. One sentence is enough.
title: "[Chart] "
labels: ["chart feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying a generated chart. **Any feedback helps, even one sentence or a
        general impression.** Only the first box is required; the rest is optional.
        English, 日本語 and 中文 are all welcome.

        **Please do not attach audio or the `.osz` file.** Songs are copyrighted, and the `.osz`
        contains the song. A song name or link is enough.

        What mappers and players tell us decides what our models get better at and what we build
        next. We read every report, use reported charts as test cases for our next models (R3,
        and the bigger model built for mappers), and reply here once a model has been checked
        against yours. Reports are public, and we publish them as an open dataset under CC BY 4.0,
        credited by the name you give at the end.

  - type: textarea
    id: observations
    attributes:
      label: What did you notice?
      description: >-
        Anything goes: a general impression, one moment, or a list. If you can, say where in the
        song, and what a mapper would do instead. What worked helps us as much as what did not.
      placeholder: |
        The long notes feel random in the chorus.
        1:10-1:25: the drop is no denser than the verse.
        00:42:310 (42310|0,42465|1) - jack on a held vocal; a long note would follow it better
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Screenshot or time range (optional)
      description: >-
        Drag in a screenshot or a short video of the moment, or write the time range, for example
        1:10-1:25. An osu! editor timestamp works too: select the notes and press Ctrl+C.

  - type: input
    id: song
    attributes:
      label: Song (optional)
      description: Artist and title, or a link to the song or its osu! beatmap page. No audio files, please.

  - type: input
    id: model
    attributes:
      label: Model (optional)
      description: >-
        For example "Ensomi R2 1.0 on ensomi.app". The list under the result on ensomi.app shows
        the model, star and seed; with them we can regenerate the chart. From the Python command,
        `receipt.json` holds them (you can attach it).
      placeholder: Ensomi R2 1.0, ensomi.app, star 3.5, seed 1234567890

  - type: textarea
    id: chart
    attributes:
      label: The .osu file (optional)
      description: >-
        Rename the `.osu` to `.txt` and drag it here; GitHub does not accept `.osu` files. Only the
        `.osu`: the `.osz` contains the song's audio.

  - type: checkboxes
    id: areas
    attributes:
      label: What is it about? (optional)
      options:
        - label: "Timing: notes early or late against the music, the offset, tempo changes"
        - label: "Rhythm: which sounds get notes, notes on silence, sounds left out"
        - label: "Patterns: jacks, trills, chords, streams, hand balance"
        - label: "Long notes: where they start and end, how many"
        - label: "Difficulty: not the star requested, or uneven through the song"
        - label: "Section requests: a stream, jack or difficulty request for part of the song"
        - label: "Flow and structure: build-ups, breaks, how the chart follows the song's sections"
        - label: "Something worked well"

  - type: dropdown
    id: keep
    attributes:
      label: Would you keep this chart? (optional)
      options:
        - Yes, as it is
        - Yes, after small edits
        - Only after large edits
        - "No"

  - type: textarea
    id: wish
    attributes:
      label: What would you want ensomi to do? (optional)
      description: A control, a tool, a way to play or to map that would make ensomi more useful to you.

  - type: dropdown
    id: perspective
    attributes:
      label: You are mostly (optional)
      options:
        - A mapper
        - A player
        - Both

  - type: input
    id: credit
    attributes:
      label: How should we credit you? (optional)
      description: An osu! username, your GitHub name, or "anonymous". Blank means your GitHub name.
