name: Chart feedback
description: Tell us how a chart generated by ensomi plays, as a mapper or a player.
title: "[Chart] "
labels: ["chart feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for playing or reading a generated chart. One chart per report helps most.
        English, 日本語 and 中文 are all welcome.

        What mappers and players tell us decides what the next model gets better at and what we
        build next. We read every report. Reported charts become test cases for the next model,
        starting with R3, and we reply here once that model has been checked against yours.

        Reports are public, and we publish them as an open dataset under CC BY 4.0, credited by
        the name you give below. Please do not attach the song's audio.

  - type: dropdown
    id: source
    attributes:
      label: Where did you generate it?
      options:
        - ensomi.app, in the browser
        - The ensomi app (macOS or iOS)
        - The Python command (ensomi_model.system.make)
        - Other
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Model and settings
      description: >-
        On ensomi.app, copy the list shown under the result (Model, Star, Seed and the rest).
        From the Python command, paste or attach `receipt.json`. The model, star and seed let us
        regenerate the chart.
      placeholder: |
        Model: Ensomi R2 1.0
        Star: 3.5
        Seed: 1234567890
    validations:
      required: true

  - type: input
    id: song
    attributes:
      label: Song
      description: Artist and title, with a link to the song or its osu! beatmap page if you have one.
    validations:
      required: true

  - type: textarea
    id: chart
    attributes:
      label: The chart
      description: >-
        Drag the `.osu` file here after renaming it to `.txt` (GitHub does not accept `.osu` or
        `.osz` files, and the `.osz` holds the audio). A screenshot or a short video of a moment
        helps too.

  - type: checkboxes
    id: areas
    attributes:
      label: What is it about?
      options:
        - label: "Timing: notes early or late against the music, the offset, tempo changes"
        - label: "Rhythm: which sounds get notes, notes on silence, sounds left out"
        - label: "Patterns: jacks, trills, chords, streams, hand balance"
        - label: "Long notes: where they start and end, how many"
        - label: "Difficulty: not the star requested, or uneven through the song"
        - label: "Section requests: a stream, jack or difficulty request for part of the song"
        - label: "Flow and structure: build-ups, breaks, how the chart follows the song's sections"
        - label: "Something worked well"

  - type: textarea
    id: observations
    attributes:
      label: What did you notice?
      description: >-
        One point per line, starting with an osu! editor timestamp (select the notes in the
        editor and press Ctrl+C). Say what happens there and what a mapper would do instead.
        What worked is as useful to us as what did not.
      placeholder: |
        00:42:310 (42310|0,42465|1) - jack on a held vocal; a long note would follow the sound
        01:10:000 - the chorus is no denser than the verse
        01:32:150 - this trill section fits the guitar well
    validations:
      required: true

  - type: dropdown
    id: keep
    attributes:
      label: Would you keep this chart?
      options:
        - Yes, as it is
        - Yes, after small edits
        - Only after large edits
        - "No"
    validations:
      required: true

  - type: textarea
    id: wish
    attributes:
      label: What would you want ensomi to do? (optional)
      description: A control, a tool, a way to play or to map that would make this chart, or ensomi, more useful to you.

  - type: dropdown
    id: perspective
    attributes:
      label: You are mostly
      options:
        - A mapper
        - A player
        - Both

  - type: input
    id: experience
    attributes:
      label: Your osu!mania experience (optional)
      placeholder: e.g. play around 4★; mapped two 4K sets

  - type: input
    id: credit
    attributes:
      label: How should we credit you?
      description: An osu! username, your GitHub name, or "anonymous". Blank means your GitHub name.
