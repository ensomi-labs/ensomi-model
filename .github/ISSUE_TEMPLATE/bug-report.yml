name: Bug report
description: The code fails or misbehaves, for example installation, the generate command, the model service or the exporter.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A chart that plays badly goes in **Chart feedback** instead. Problems with ensomi.app go
        to [ensomi-web](https://github.com/ensomi-labs/ensomi-web/issues), and with the app to
        [ensomi](https://github.com/ensomi-labs/ensomi/issues).

  - type: textarea
    id: command
    attributes:
      label: What you ran
      render: shell
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: Paste the error output in full.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit you ran, for example `r2-1.0`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and chip or GPU, Python version, and the extra you installed (`mps` or `cuda`).
    validations:
      required: true
