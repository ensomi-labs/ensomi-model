[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ensomi-model"
version = "0.1.0"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy==1.26.4",
    "psutil==7.2.2",
    "pyarrow==22.0.0",
    "pydub==0.25.1",
    "hydra-core==1.3.3",
    "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
mps = [
    "torch==2.11.0; platform_system == 'Darwin'",
    "torchaudio==2.11.0; platform_system == 'Darwin'",
    "nnAudio==0.3.4; platform_system == 'Darwin'",
    "soundfile==0.13.1; platform_system == 'Darwin'",
]
cuda = [
    "torch==2.11.0; platform_system == 'Linux'",
    "torchaudio==2.11.0; platform_system == 'Linux'",
    "nnAudio==0.3.4; platform_system == 'Linux'",
    "soundfile==0.13.1; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
default-groups = []
conflicts = [[{ extra = "mps" }, { extra = "cuda" }]]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ensomi_model" = ["configs/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda", marker = "platform_system == 'Linux'" }]
torchaudio = [{ index = "pytorch-cu128", extra = "cuda", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
